[project]
name = "scoutai"
version = "0.1.0"
description = "Chat with any website: crawl it, index it locally, and get cited answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pranudeep Metuku" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "lxml>=5.3",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
js = [
    "playwright>=1.48",
]

[project.scripts]
scoutai = "scoutai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
